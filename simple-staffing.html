<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Staffing Planner - Chili's</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0f1419;
            --card: #1a1f2e;
            --border: #3d4556;
            --text: #e8eaed;
            --text-dim: #9aa0a6;
            --accent: #4a9eff;
            --success: #34a853;
            --warning: #fbbc04;
            --danger: #ea4335;
        }

        body.light {
            --bg: #f5f5f5;
            --card: #ffffff;
            --border: #e0e0e0;
            --text: #202124;
            --text-dim: #5f6368;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: var(--card);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
        }

        h1 { font-size: 24px; }

        .controls {
            display: flex;
            gap: 10px;
        }

        button, select {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover, select:hover {
            opacity: 0.8;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat {
            background: var(--card);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
        }

        .stat-sub {
            font-size: 13px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .inputs {
            background: var(--card);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .input-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 6px;
            font-weight: 500;
        }

        input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        table {
            width: 100%;
            background: var(--card);
            border-radius: 8px;
            border-collapse: collapse;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        th {
            background: var(--bg);
            padding: 12px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-dim);
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        tr:hover {
            background: var(--bg);
        }

        .section {
            background: var(--bg);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 12px;
            color: var(--accent);
        }

        .total {
            background: var(--bg);
            font-weight: 700;
            border-top: 2px solid var(--border);
        }

        .grand-total {
            background: var(--accent);
            color: white;
            font-weight: 700;
        }

        .edit {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 4px;
            width: 90px;
            text-align: right;
            color: var(--text);
        }

        .success { color: var(--success); }
        .warning { color: var(--warning); }
        .danger { color: var(--danger); }

        @media (max-width: 768px) {
            .stats { grid-template-columns: 1fr; }
            table { font-size: 12px; }
            th, td { padding: 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Weekly Staffing Planner</h1>
            <div class="controls">
                <select id="location" onchange="loadLocation()">
                    <option value="">Select Location...</option>
                </select>
                <button onclick="saveLocation()">💾 Save</button>
                <button onclick="toggleTheme()">☀️</button>
            </div>
        </header>

        <div class="stats">
            <div class="stat">
                <div class="stat-label">Weekly Sales</div>
                <div class="stat-value" id="sales">$0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Labor Cost</div>
                <div class="stat-value" id="cost">$0</div>
                <div class="stat-sub"><span id="percent">0%</span> of sales</div>
            </div>
            <div class="stat">
                <div class="stat-label">Total Hours</div>
                <div class="stat-value" id="hours">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Status</div>
                <div class="stat-value" id="status">-</div>
            </div>
        </div>

        <div class="inputs">
            <h3 style="margin-bottom: 15px;">📈 This Week's Plan</h3>
            <div class="input-row">
                <div>
                    <label>Location Name</label>
                    <input type="text" id="name" placeholder="e.g., Auburn Hills">
                </div>
                <div>
                    <label>Projected Sales</label>
                    <input type="number" id="salesInput" value="117100" onchange="calc()">
                </div>
                <div>
                    <label>Labor % Target</label>
                    <input type="number" step="0.1" id="target" value="18.0" onchange="calc()">
                </div>
                <div>
                    <label>Volume Adjust</label>
                    <input type="number" step="0.1" id="volume" value="1.0" onchange="calc()">
                </div>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Position</th>
                    <th>Recommended</th>
                    <th>Scheduled</th>
                    <th>Wage</th>
                    <th>Cost</th>
                    <th>SPLH</th>
                </tr>
            </thead>
            <tbody id="table"></tbody>
        </table>
    </div>

    <script>
        const positions = {
            'FOH': {
                'Bartender': { wage: 8, splh: 1500, base: 80 },
                'Busser': { wage: 12, splh: 2000, base: 130 },
                'Food Runner': { wage: 8, splh: 500, base: 220 },
                'Server': { wage: 8, splh: 300, base: 400 },
                'Host': { wage: 16, splh: 1200, base: 95 },
                'To-Go': { wage: 16, splh: 1150, base: 100 }
            },
            'HOH': {
                'Cook': { wage: 21, splh: 250, base: 460 },
                'Dishwasher': { wage: 19, splh: 1750, base: 65 }
            }
        };

        let scheduled = {};

        function calc() {
            const sales = parseFloat(document.getElementById('salesInput').value) || 0;
            const target = parseFloat(document.getElementById('target').value) / 100 || 0.18;
            const volume = parseFloat(document.getElementById('volume').value) || 1.0;

            let totalHours = 0, totalCost = 0;
            const tbody = document.getElementById('table');
            tbody.innerHTML = '';

            ['FOH', 'HOH'].forEach(section => {
                tbody.innerHTML += `<tr class="section"><td colspan="6">${section === 'FOH' ? 'FRONT OF HOUSE' : 'HEART OF HOUSE'}</td></tr>`;

                let sectionHours = 0, sectionCost = 0;

                Object.entries(positions[section]).forEach(([name, data]) => {
                    const recommended = (sales / data.splh * volume);
                    const key = section + '_' + name;
                    if (!scheduled[key]) scheduled[key] = data.base;

                    const hrs = scheduled[key] * volume;
                    const cost = hrs * data.wage;
                    const splh = sales / hrs;

                    sectionHours += hrs;
                    sectionCost += cost;

                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${name}</strong></td>
                            <td>${recommended.toFixed(1)} hrs</td>
                            <td><input class="edit" type="number" value="${scheduled[key]}"
                                onchange="scheduled['${key}'] = parseFloat(this.value); calc()"></td>
                            <td>$${data.wage}/hr</td>
                            <td>$${cost.toFixed(0)}</td>
                            <td>$${splh.toFixed(0)}</td>
                        </tr>
                    `;
                });

                totalHours += sectionHours;
                totalCost += sectionCost;

                tbody.innerHTML += `
                    <tr class="total">
                        <td><strong>${section} Total</strong></td>
                        <td>-</td>
                        <td><strong>${sectionHours.toFixed(1)}</strong></td>
                        <td>-</td>
                        <td><strong>$${sectionCost.toFixed(0)}</strong></td>
                        <td><strong>$${(sales / sectionHours).toFixed(0)}</strong></td>
                    </tr>
                `;
            });

            const percent = (totalCost / sales) * 100;

            tbody.innerHTML += `
                <tr class="grand-total">
                    <td><strong>TOTAL</strong></td>
                    <td>-</td>
                    <td><strong>${totalHours.toFixed(1)}</strong></td>
                    <td>-</td>
                    <td><strong>$${totalCost.toFixed(0)}</strong></td>
                    <td><strong>${percent.toFixed(1)}%</strong></td>
                </tr>
            `;

            document.getElementById('sales').textContent = '$' + sales.toLocaleString();
            document.getElementById('cost').textContent = '$' + totalCost.toLocaleString();
            document.getElementById('percent').textContent = percent.toFixed(1) + '%';
            document.getElementById('hours').textContent = totalHours.toFixed(1);

            const targetPercent = target * 100;
            let status = '';
            if (percent < targetPercent - 1) {
                status = '<span class="success">✓ Under</span>';
            } else if (percent > targetPercent + 1) {
                status = '<span class="danger">⚠ Over</span>';
            } else {
                status = '<span class="warning">→ On Target</span>';
            }
            document.getElementById('status').innerHTML = status;
        }

        function saveLocation() {
            const name = document.getElementById('name').value.trim();
            if (!name) { alert('Enter location name'); return; }

            const data = {
                name,
                sales: document.getElementById('salesInput').value,
                target: document.getElementById('target').value,
                volume: document.getElementById('volume').value,
                scheduled
            };

            const locations = JSON.parse(localStorage.getItem('locations') || '{}');
            locations[name] = data;
            localStorage.setItem('locations', JSON.stringify(locations));
            loadList();
            alert('Saved!');
        }

        function loadLocation() {
            const name = document.getElementById('location').value;
            if (!name) return;

            const locations = JSON.parse(localStorage.getItem('locations') || '{}');
            const data = locations[name];

            if (data) {
                document.getElementById('name').value = data.name;
                document.getElementById('salesInput').value = data.sales;
                document.getElementById('target').value = data.target;
                document.getElementById('volume').value = data.volume || 1.0;
                scheduled = data.scheduled || {};
                calc();
            }
        }

        function loadList() {
            const locations = JSON.parse(localStorage.getItem('locations') || '{}');
            const select = document.getElementById('location');
            select.innerHTML = '<option value="">Select Location...</option>';
            Object.keys(locations).forEach(name => {
                select.innerHTML += `<option value="${name}">${name}</option>`;
            });
        }

        function toggleTheme() {
            document.body.classList.toggle('light');
        }

        loadList();
        calc();
    </script>
</body>
</html>
